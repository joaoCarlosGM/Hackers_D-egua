name: Browser Linux CTF Review
on:
  pull_request:
    paths:
      - "src/CtfReviewBrowser.tsx"
      - "src/ctf-review-browser.css"
      - "src/AdminNavigation.tsx"
      - "src/Admin.tsx"
      - "src/App.tsx"
      - "scripts/prepare-v86.mjs"
      - "scripts/test-v86-boot.mjs"
      - "supabase/migrations/202611230002_ctf_teacher_browser_review.sql"
      - "package.json"
      - ".github/workflows/browser-ctf-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check React and TypeScript integration
        run: npm run typecheck
      - name: Fetch and verify Linux browser emulator assets
        run: node scripts/prepare-v86.mjs
      - name: Install Chromium for real Linux boot test
        run: npx playwright install chromium
      - name: Verify real v86 Linux shell boot in headless browser
        run: node scripts/test-v86-boot.mjs
      - name: Build GitHub Pages bundle
        run: npx vite build
      - name: Confirm generated browser Linux images
        run: |
          test -s dist/ctf-v86/libv86.js
          test -s dist/ctf-v86/v86.wasm
          test -s dist/ctf-v86/buildroot-bzimage68.bin
          test -s dist/ctf-v86/seabios.bin
          test -s dist/ctf-v86/vgabios.bin
          test -s dist/ctf-v86/xterm.js
          test -s dist/ctf-v86/xterm.css
          test -s dist/ctf-v86/xterm-addon-fit.js
