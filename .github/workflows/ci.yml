name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check live Supabase answer-key access as anonymous visitor
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check:live-answers
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run test:db
      - run: npm run build
      - run: npm run check:public-dist
      - run: npm run test:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: |
            artifacts/visual/
            playwright-report/
            test-results/
          retention-days: 7
